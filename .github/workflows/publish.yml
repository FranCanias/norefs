name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # A release tag that disagrees with package.json republishes the old
      # version. npm rejects the duplicate, but the rejection explains nothing
      # — so the mismatch says its own name here instead.
      - name: Check the tag matches package.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const { version } = require("./package.json");
            if (tag !== version) {
              console.error(`error: release tag ${tag} does not match package.json version ${version}`);
              process.exit(1);
            }
          '
      # Trusted publishing and automatic provenance need npm >= 11.5.1. The
      # runner image ships whatever it ships, and it changes without a commit
      # here — so the exact version this job depends on is named here. Nothing
      # bumps it automatically; raise it in a commit when a release needs a
      # newer npm.
      - run: npm install -g npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # The test setup builds `dist` for the suites that spawn it, and
      # `prepublishOnly` rebuilds it for the tarball — so `prepublishOnly` is
      # the single source of the published artifact, with no build step here
      # to disagree with it.
      - run: pnpm test
      - run: npm publish --provenance
