name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # A release tag that disagrees with package.json republishes the old
      # version. npm rejects the duplicate, but the rejection explains nothing
      # — so the mismatch says its own name here instead.
      - name: Check the tag matches package.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const { version } = require("./package.json");
            if (tag !== version) {
              console.error(`error: release tag ${tag} does not match package.json version ${version}`);
              process.exit(1);
            }
          '
      # Trusted publishing and automatic provenance need npm >= 11.5.1. The
      # runner image ships whatever it ships, and it changes without a commit
      # here — so the version this job depends on is named here.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: npm publish --provenance
