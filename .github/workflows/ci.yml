name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request from a fork inherits the repository default otherwise, which
# can be a write-scoped token. Nothing here writes.
permissions:
  contents: read

# A second push supersedes the first. Let the first one stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite finishes in about 20 seconds. GitHub's default is six hours, and
    # watch mode and --verify-command both spawn children that can hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor the engines field promises, and the current release. A
        # promise nobody tests is not a promise.
        node-version: ['22.4', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # norefs over norefs: the smallest corpus entry, and the one that has to
      # stay at zero findings.
      - run: node dist/index.js

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Reported, never gated. The number says which source files no test
      # reaches; a threshold would only invite tests written to raise it.
      - run: pnpm coverage
