name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request from a fork inherits the repository default otherwise, which
# can be a write-scoped token. Nothing here writes.
permissions:
  contents: read

# A second push supersedes the first. Let the first one stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite finishes in about 20 seconds. GitHub's default is six hours, and
    # watch mode and --verify-command both spawn children that can hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4 pulls vite and rolldown, and both require Node 22.12 or
        # newer. That is the toolchain's floor, not the tool's — the `floor`
        # job below is what checks the one `engines` promises.
        node-version: ['22.12', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # norefs over norefs: the smallest corpus entry, and the one that has to
      # stay at zero findings.
      - run: node dist/index.js

  # A promise nobody tests is not a promise, and `engines` promises Node 22.4
  # of the published CLI — not of the test runner, which needs 22.12. So the
  # floor is checked the only way that means anything: the built binary runs
  # there. `--no-explain` is a `parseArgs({ allowNegative: true })` flag, which
  # is the whole reason the floor is 22.4 and not older.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.4'
          cache: pnpm
      # .npmrc says engine-strict, and the dev toolchain (vite, rolldown) asks
      # for Node 22.12+ — which would refuse this install on the one job that
      # exists to run below the toolchain's floor. The binary under test needs
      # none of those packages, so the gate is lifted for this install alone.
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_engine_strict: 'false'
      - run: pnpm build
      - run: node dist/index.js --no-explain

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Reported, never gated. The number says which source files no test
      # reaches; a threshold would only invite tests written to raise it.
      - run: pnpm coverage
